[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spory"
dynamic = ["version"]
description = "Smart laptop power management: charge by deadline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]

[project.scripts]
spory = "spory.cli:main"

[project.gui-scripts]
spory-gui = "spory.gui.app:main"

[tool.setuptools]
packages = ["spory", "spory.gui"]

[tool.setuptools.dynamic]
version = { attr = "spory.__version__" }

[dependency-groups]
build = ["pyinstaller>=6.10", "pillow>=10"]

[tool.setuptools.package-data]
"spory.gui" = ["fonts/*"]
